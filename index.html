<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR YouTube Cinema</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* =========================
       PAINEL INICIAL
    ========================= */

    #ui {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);

      width: min(92%, 430px);

      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;

      padding: 16px;

      color: white;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 10px 40px rgba(0,0,0,.5);
    }

    #ui h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    #ui p {
      margin: 0 0 14px;
      font-size: 13px;
      color: #aaa;
    }

    #youtubeUrl {
      width: 100%;
      height: 45px;

      border: 1px solid #333;
      border-radius: 10px;

      background: #080808;
      color: white;

      padding: 0 12px;

      outline: none;

      font-size: 14px;
    }

    #youtubeUrl:focus {
      border-color: #777;
    }

    button {
      border: 0;
      border-radius: 10px;

      min-height: 45px;

      padding: 0 16px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    #loadYoutube {
      width: 100%;
      margin-top: 10px;

      background: white;
      color: black;
    }

    #startAR {
      width: 100%;
      margin-top: 10px;

      background: #ff0000;
      color: white;
    }

    button:active {
      transform: scale(.98);
    }

    /* =========================
       PLAYER YOUTUBE
    ========================= */

    #youtubeContainer {
      position: fixed;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        scale(1);

      width: min(88vw, 800px);
      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 8px;

      overflow: hidden;

      z-index: 15;

      display: none;

      box-shadow:
        0 20px 80px rgba(0,0,0,.7);

      border: 1px solid rgba(255,255,255,.15);
    }

    #youtubeContainer iframe {
      width: 100%;
      height: 100%;

      border: 0;
    }

    /* =========================
       CONTROLES AR
    ========================= */

    #arControls {
      position: fixed;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      z-index: 30;

      display: none;

      width: min(94%, 500px);

      padding: 10px;

      background: rgba(10,10,10,.85);

      border-radius: 16px;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: white;
    }

    .controlRow {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .controlRow + .controlRow {
      margin-top: 8px;
    }

    .controlRow button {
      flex: 1;

      background: #252525;
      color: white;
    }

    .controlRow button.primary {
      background: white;
      color: black;
    }

    #sizeValue {
      min-width: 55px;
      text-align: center;
      font-size: 13px;
      color: #ccc;
    }

    /* =========================
       RETÍCULO
    ========================= */

    #reticle {
      position: fixed;

      left: 50%;
      top: 50%;

      width: 50px;
      height: 50px;

      transform: translate(-50%, -50%);

      border: 2px solid white;
      border-radius: 50%;

      z-index: 10;

      display: none;

      pointer-events: none;

      box-shadow:
        0 0 15px rgba(255,255,255,.7);
    }

    #reticle::before,
    #reticle::after {
      content: "";

      position: absolute;

      background: white;
    }

    #reticle::before {
      width: 2px;
      height: 70px;

      left: 50%;
      top: -12px;

      transform: translateX(-50%);
    }

    #reticle::after {
      width: 70px;
      height: 2px;

      top: 50%;
      left: -12px;

      transform: translateY(-50%);
    }

    /* =========================
       INSTRUÇÕES
    ========================= */

    #instruction {
      position: fixed;

      left: 50%;
      top: 15%;

      transform: translateX(-50%);

      z-index: 25;

      display: none;

      width: min(90%, 400px);

      text-align: center;

      color: white;

      background: rgba(0,0,0,.65);

      padding: 12px 16px;

      border-radius: 12px;

      font-size: 14px;

      backdrop-filter: blur(10px);
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      position: fixed;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 40;

      display: none;

      color: white;

      background: rgba(0,0,0,.7);

      padding: 8px 14px;

      border-radius: 20px;

      font-size: 12px;

      white-space: nowrap;
    }

    /* =========================
       BOTÃO SAIR
    ========================= */

    #exitAR {
      position: fixed;

      top: 15px;
      right: 15px;

      z-index: 40;

      display: none;

      background: rgba(0,0,0,.75);

      color: white;

      border: 1px solid rgba(255,255,255,.2);

      border-radius: 50%;

      width: 45px;
      height: 45px;

      padding: 0;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {

      #ui {
        bottom: 30px;
      }

      #youtubeContainer {
        width: 720px;
      }

    }
  </style>
</head>

<body>

  <!--
    CANVAS WEBGL
  -->
  <canvas id="arCanvas"></canvas>


  <!--
    RETÍCULO DE HIT TEST
  -->
  <div id="reticle"></div>


  <!--
    STATUS
  -->
  <div id="status">
    AR ativo
  </div>


  <!--
    INSTRUÇÃO
  -->
  <div id="instruction">
    Aponte para uma superfície e mova lentamente o celular.
  </div>


  <!--
    BOTÃO SAIR
  -->
  <button id="exitAR">
    ✕
  </button>


  <!--
    MENU PRINCIPAL
  -->
  <div id="ui">

    <h1>🥽 AR YouTube Cinema</h1>

    <p>
      Coloque um vídeo do YouTube em uma tela de realidade aumentada.
    </p>

    <input
      id="youtubeUrl"
      type="text"
      placeholder="Cole o link do YouTube"
      autocomplete="off"
    >

    <button id="loadYoutube">
      Carregar vídeo
    </button>

    <button id="startAR">
      INICIAR AR
    </button>

  </div>


  <!--
    PLAYER YOUTUBE
  -->
  <div id="youtubeContainer">

    <iframe
      id="youtubeFrame"
      allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        fullscreen
      "
      allowfullscreen>
    </iframe>

  </div>


  <!--
    CONTROLES AR
  -->
  <div id="arControls">

    <div class="controlRow">

      <button id="smaller">
        −
      </button>

      <span id="sizeValue">
        100%
      </span>

      <button id="larger">
        +
      </button>

    </div>

    <div class="controlRow">

      <button id="reposition">
        Reposicionar
      </button>

      <button
        id="hideControls"
        class="primary">
        Ocultar
      </button>

    </div>

  </div>


  <script type="module">

    /*
    ============================================================
      IMPORTS
    ============================================================
    */

    import {
      WebXRButton
    } from './js/util/webxr-button.js';

    import {
      Scene
    } from './js/render/scenes/scene.js';

    import {
      Renderer,
      createWebGLContext
    } from './js/render/core/renderer.js';

    import {
      SkyboxNode
    } from './js/render/nodes/skybox.js';

    import {
      InlineViewerHelper
    } from './js/util/inline-viewer-helper.js';

    import {
      QueryArgs
    } from './js/util/query-args.js';

    import WebXRPolyfill
      from './js/third-party/webxr-polyfill/build/webxr-polyfill.module.js';


    /*
    ============================================================
      POLYFILL
    ============================================================
    */

    if (QueryArgs.getBool('usePolyfill', true)) {

      new WebXRPolyfill();

    }


    /*
    ============================================================
      ELEMENTOS
    ============================================================
    */

    const canvas =
      document.getElementById('arCanvas');

    const ui =
      document.getElementById('ui');

    const startAR =
      document.getElementById('startAR');

    const loadYoutube =
      document.getElementById('loadYoutube');

    const youtubeUrl =
      document.getElementById('youtubeUrl');

    const youtubeContainer =
      document.getElementById('youtubeContainer');

    const youtubeFrame =
      document.getElementById('youtubeFrame');

    const reticle =
      document.getElementById('reticle');

    const instruction =
      document.getElementById('instruction');

    const status =
      document.getElementById('status');

    const exitAR =
      document.getElementById('exitAR');

    const arControls =
      document.getElementById('arControls');

    const smaller =
      document.getElementById('smaller');

    const larger =
      document.getElementById('larger');

    const sizeValue =
      document.getElementById('sizeValue');

    const reposition =
      document.getElementById('reposition');

    const hideControls =
      document.getElementById('hideControls');


    /*
    ============================================================
      XR
    ============================================================
    */

    let xrButton = null;

    let xrSession = null;

    let xrReferenceSpace = null;

    let viewerSpace = null;

    let hitTestSource = null;

    let hitTestSourceRequested = false;


    /*
    ============================================================
      WEBGL
    ============================================================
    */

    let gl = null;

    let renderer = null;

    let scene = new Scene();


    /*
    ============================================================
      SKYBOX
    ============================================================
    */

    const skybox =
      new SkyboxNode({
        url: 'media/textures/milky-way-4k.png'
      });

    scene.addNode(skybox);


    /*
    ============================================================
      ESTADO DO PLAYER
    ============================================================
    */

    let youtubeVideoId = null;

    let screenPlaced = false;

    let screenScale = 1;


    /*
    ============================================================
      EXTRAI ID DO YOUTUBE
    ============================================================
    */

    function getYouTubeVideoId(url) {

      if (!url) {
        return null;
      }

      url = url.trim();

      /*
        youtube.com/watch?v=XXXX
      */

      try {

        const parsed =
          new URL(url);

        if (
          parsed.hostname.includes('youtube.com')
        ) {

          const id =
            parsed.searchParams.get('v');

          if (id) {
            return id;
          }

        }

        /*
          youtu.be/XXXX
        */

        if (
          parsed.hostname === 'youtu.be'
        ) {

          return parsed.pathname
            .replace('/', '')
            .split('?')[0];

        }

        /*
          youtube.com/shorts/XXXX
        */

        if (
          parsed.pathname.startsWith('/shorts/')
        ) {

          return parsed.pathname
            .split('/shorts/')[1]
            .split('/')[0];

        }

        /*
          youtube.com/embed/XXXX
        */

        if (
          parsed.pathname.startsWith('/embed/')
        ) {

          return parsed.pathname
            .split('/embed/')[1]
            .split('/')[0];

        }

      } catch (error) {

        console.warn(
          'URL inválida:',
          error
        );

      }

      return null;

    }


    /*
    ============================================================
      CARREGAR YOUTUBE
    ============================================================
    */

    function loadYouTube() {

      const id =
        getYouTubeVideoId(
          youtubeUrl.value
        );

      if (!id) {

        alert(
          'Cole um link válido do YouTube.'
        );

        return;

      }

      youtubeVideoId = id;

      youtubeFrame.src =
        'https://www.youtube.com/embed/' +
        encodeURIComponent(id) +
        '?autoplay=1' +
        '&playsinline=1' +
        '&rel=0';

      youtubeContainer.style.display =
        'block';

      status.textContent =
        'Vídeo carregado';

      status.style.display =
        'block';

    }


    /*
    ============================================================
      EVENTO CARREGAR
    ============================================================
    */

    loadYoutube.addEventListener(
      'click',
      loadYouTube
    );


    /*
    ============================================================
      WEBGL
    ============================================================
    */

    function initGL() {

      if (gl) {
        return;
      }

      gl =
        createWebGLContext({
          canvas: canvas,
          xrCompatible: true
        });

      renderer =
        new Renderer(gl);

      scene.setRenderer(renderer);

    }


    /*
    ============================================================
      INICIAR XR
    ============================================================
    */

    function initXR() {

      xrButton =
        new WebXRButton({

          onRequestSession:
            onRequestSession,

          onEndSession:
            onEndSession,

          textEnterXRTitle:
            'START AR',

          textXRNotFoundTitle:
            'AR NÃO ENCONTRADO',

          textExitXRTitle:
            'SAIR DO AR'

        });


      /*
        Mantemos o botão original do WebXR.
      */

      document.body.appendChild(
        xrButton.domElement
      );


      /*
        Verifica suporte.
      */

      if (navigator.xr) {

        navigator.xr
          .isSessionSupported(
            'immersive-ar'
          )
          .then(
            supported => {

              xrButton.enabled =
                supported;

              startAR.disabled =
                !supported;

              if (!supported) {

                startAR.textContent =
                  'AR NÃO SUPORTADO';

              }

            }
          );

      } else {

        startAR.disabled =
          true;

        startAR.textContent =
          'WEBXR NÃO DISPONÍVEL';

      }

    }


    /*
    ============================================================
      PEDIR SESSÃO AR
    ============================================================
    */

    function onRequestSession() {

      const sessionInit = {

        requiredFeatures: [
          'local'
        ],

        optionalFeatures: [
          'hit-test',
          'dom-overlay'
        ]

      };


      /*
        DOM Overlay permite colocar
        o iframe do YouTube sobre a
        experiência AR.
      */

      sessionInit.domOverlay = {
        root: document.body
      };


      return navigator.xr
        .requestSession(
          'immersive-ar',
          sessionInit
        )
        .then(
          session => {

            xrSession =
              session;

            xrButton.setSession(
              session
            );

            session.isImmersive =
              true;

            onSessionStarted(
              session
            );

          }
        );

    }


    /*
    ============================================================
      WEBXR SESSION
    ============================================================
    */

    function onSessionStarted(
      session
    ) {

      session.addEventListener(
        'end',
        onSessionEnded
      );


      /*
        AR deve mostrar o mundo real.
      */

      skybox.visible =
        false;


      initGL();


      session.updateRenderState({

        baseLayer:
          new XRWebGLLayer(
            session,
            gl
          )

      });


      /*
        Espaço local.
      */

      session
        .requestReferenceSpace(
          'local'
        )
        .then(
          refSpace => {

            xrReferenceSpace =
              refSpace;


            /*
              Listener para reset.
            */

            xrReferenceSpace
              .addEventListener(
                'reset',
                event => {

                  if (event.transform) {

                    xrReferenceSpace =
                      xrReferenceSpace
                        .getOffsetReferenceSpace(
                          event.transform
                        );

                  }

                }
              );


            /*
              Solicita viewer space
              para hit-test.
            */

            return session
              .requestReferenceSpace(
                'viewer'
              );

          }
        )
        .then(
          space => {

            viewerSpace =
              space;

            session.requestAnimationFrame(
              onXRFrame
            );

          }
        );


      /*
        Interface AR.
      */

      ui.style.display =
        'none';

      status.style.display =
        'block';

      status.textContent =
        'AR ativo';

      instruction.style.display =
        'block';

      reticle.style.display =
        'block';

      exitAR.style.display =
        'block';


      /*
        Player somente aparece
        se um vídeo já foi carregado.
      */

      if (youtubeVideoId) {

        youtubeContainer.style.display =
          'block';

        arControls.style.display =
          'block';

      }

    }


    /*
    ============================================================
      HIT TEST
    ============================================================
    */

    function requestHitTestSource(
      session
    ) {

      if (
        hitTestSourceRequested
      ) {
        return;
      }

      hitTestSourceRequested =
        true;


      if (
        !session.requestHitTestSource
      ) {

        console.warn(
          'Hit Test não disponível.'
        );

        return;

      }


      session
        .requestHitTestSource({
          space: viewerSpace
        })
        .then(
          source => {

            hitTestSource =
              source;

          }
        );


      session.addEventListener(
        'end',
        () => {

          hitTestSourceRequested =
            false;

          hitTestSource =
            null;

        },
        {
          once: true
        }
      );

    }


    /*
    ============================================================
      FRAME AR
    ============================================================
    */

    function onXRFrame(
      time,
      frame
    ) {

      const session =
        frame.session;


      session.requestAnimationFrame(
        onXRFrame
      );


      /*
        Solicita hit-test.
      */

      requestHitTestSource(
        session
      );


      /*
        Pose da câmera.
      */

      const pose =
        frame.getViewerPose(
          xrReferenceSpace
        );


      if (!pose) {
        return;
      }


      /*
        Resultado do hit-test.
      */

      if (
        hitTestSource
      ) {

        const hitTestResults =
          frame.getHitTestResults(
            hitTestSource
          );


        if (
          hitTestResults.length > 0
        ) {

          const hit =
            hitTestResults[0];


          const hitPose =
            hit.getPose(
              xrReferenceSpace
            );


          if (hitPose) {

            /*
              Encontramos uma superfície.

              O retículo visual continua
              no centro da tela indicando
              que existe uma superfície
              válida.
            */

            reticle.style.opacity =
              '1';

          }

        } else {

          reticle.style.opacity =
            '.35';

        }

      }


      /*
        Renderização da cena.
      */

      scene.startFrame();

      scene.drawXRFrame(
        frame,
        pose
      );

      scene.endFrame();

    }


    /*
    ============================================================
      TOQUE NA TELA
    ============================================================
    */

    canvas.addEventListener(
      'click',
      () => {

        if (!xrSession) {
          return;
        }

        if (!hitTestSource) {
          return;
        }


        /*
          Marca que o usuário encontrou
          uma superfície.

          O iframe do YouTube continua
          sendo DOM overlay.
        */

        screenPlaced =
          true;


        instruction.style.display =
          'none';


        status.textContent =
          'Tela posicionada';


        /*
          Aqui futuramente podemos
          converter a posição 3D do
          hit-test para uma tela
          verdadeiramente espacial.
        */

      }
    );


    /*
    ============================================================
      TAMANHO DA TELA
    ============================================================
    */

    function updateScreenScale() {

      screenScale =
        Math.max(
          .5,
          Math.min(
            2,
            screenScale
          )
        );


      youtubeContainer.style.transform =
        'translate(-50%, -50%) scale(' +
        screenScale +
        ')';


      sizeValue.textContent =
        Math.round(
          screenScale * 100
        ) + '%';

    }


    /*
      Diminuir
    */

    smaller.addEventListener(
      'click',
      () => {

        screenScale -= .1;

        updateScreenScale();

      }
    );


    /*
      Aumentar
    */

    larger.addEventListener(
      'click',
      () => {

        screenScale += .1;

        updateScreenScale();

      }
    );


    /*
    ============================================================
      REPOSICIONAR
    ============================================================
    */

    reposition.addEventListener(
      'click',
      () => {

        screenPlaced =
          false;

        instruction.style.display =
          'block';

        status.textContent =
          'Aponte para uma superfície';

      }
    );


    /*
    ============================================================
      OCULTAR CONTROLES
    ============================================================
    */

    hideControls.addEventListener(
      'click',
      () => {

        arControls.style.display =
          'none';

      }
    );


    /*
    ============================================================
      SAIR DO AR
    ============================================================
    */

    function onEndSession(
      session
    ) {

      if (
        session &&
        session.end
      ) {

        session.end();

      }

    }


    function onSessionEnded(
      event
    ) {

      xrSession =
        null;

      hitTestSource =
        null;

      hitTestSourceRequested =
        false;

      screenPlaced =
        false;


      skybox.visible =
        true;


      ui.style.display =
        'block';

      instruction.style.display =
        'none';

      reticle.style.display =
        'none';

      status.style.display =
        'none';

      exitAR.style.display =
        'none';

      arControls.style.display =
        'none';


      if (xrButton) {

        xrButton.setSession(
          null
        );

      }

    }


    /*
    ============================================================
      BOTÃO SAIR
    ============================================================
    */

    exitAR.addEventListener(
      'click',
      () => {

        if (xrSession) {

          xrSession.end();

        }

      }
    );


    /*
    ============================================================
      BOTÃO INICIAR AR
    ============================================================
    */

    startAR.addEventListener(
      'click',
      () => {

        if (!navigator.xr) {

          alert(
            'Este navegador não possui suporte ao WebXR.'
          );

          return;

        }


        onRequestSession();

      }
    );


    /*
    ============================================================
      INICIALIZA
    ============================================================
    */

    initXR();

  </script>

</body>
</html>
