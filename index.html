<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>AR YouTube Cinema</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* =====================================
       CANVAS AR
    ===================================== */

    canvas {

      position: fixed;

      left: 0;
      top: 0;

      width: 100vw;
      height: 100vh;

      z-index: 1;

    }


    /* =====================================
       MENU
    ===================================== */

    #menu {

      position: fixed;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      width: min(92%, 430px);

      padding: 18px;

      background:
        rgba(15,15,15,.94);

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 18px;

      color: white;

      z-index: 100;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.6);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

    }


    #menu h1 {

      margin:
        0 0 6px;

      font-size: 21px;

    }


    #menu p {

      margin:
        0 0 15px;

      font-size: 13px;

      line-height: 1.5;

      color: #aaa;

    }


    /* =====================================
       INPUT
    ===================================== */

    #youtubeUrl {

      width: 100%;

      height: 48px;

      padding:
        0 13px;

      border-radius: 10px;

      border:
        1px solid #333;

      outline: none;

      background: #080808;

      color: white;

      font-size: 14px;

    }


    #youtubeUrl:focus {

      border-color: #777;

    }


    /* =====================================
       BOTÕES
    ===================================== */

    button {

      border: none;

      border-radius: 10px;

      min-height: 46px;

      padding:
        0 16px;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

    }


    #loadVideo {

      width: 100%;

      margin-top: 10px;

      background: #292929;

      color: white;

    }


    #startAR {

      width: 100%;

      margin-top: 10px;

      background: #ff0000;

      color: white;

    }


    #startAR:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    /* =====================================
       PLAYER YOUTUBE
    ===================================== */

    #youtubeScreen {

      position: fixed;

      left: 50%;
      top: 50%;

      width: min(88vw, 850px);

      aspect-ratio: 16 / 9;

      transform:
        translate(-50%, -50%)
        scale(1);

      background: #000;

      z-index: 50;

      display: none;

      border-radius: 8px;

      overflow: hidden;

      border:
        1px solid
        rgba(255,255,255,.2);

      box-shadow:
        0 20px 80px
        rgba(0,0,0,.75);

    }


    #youtubeScreen iframe {

      width: 100%;
      height: 100%;

      border: none;

      display: block;

    }


    /* =====================================
       RETÍCULO
    ===================================== */

    #reticle {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 52px;
      height: 52px;

      transform:
        translate(-50%, -50%);

      border:
        2px solid white;

      border-radius: 50%;

      z-index: 20;

      display: none;

      pointer-events: none;

      opacity: .5;

      box-shadow:
        0 0 18px
        rgba(255,255,255,.7);

    }


    #reticle::before {

      content: "";

      position: absolute;

      width: 2px;
      height: 70px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      background: white;

    }


    #reticle::after {

      content: "";

      position: absolute;

      width: 70px;
      height: 2px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      background: white;

    }


    /* =====================================
       INSTRUÇÕES
    ===================================== */

    #instruction {

      position: fixed;

      left: 50%;
      top: 12%;

      transform:
        translateX(-50%);

      width: min(90%, 420px);

      padding:
        12px 16px;

      border-radius: 12px;

      background:
        rgba(0,0,0,.65);

      color: white;

      text-align: center;

      font-size: 14px;

      z-index: 60;

      display: none;

      backdrop-filter:
        blur(10px);

    }


    /* =====================================
       STATUS
    ===================================== */

    #status {

      position: fixed;

      top: 15px;
      left: 50%;

      transform:
        translateX(-50%);

      padding:
        8px 14px;

      border-radius: 20px;

      background:
        rgba(0,0,0,.7);

      color: white;

      font-size: 12px;

      z-index: 80;

      display: none;

    }


    /* =====================================
       BOTÃO SAIR
    ===================================== */

    #exitAR {

      position: fixed;

      right: 15px;
      top: 15px;

      width: 46px;
      height: 46px;

      min-height: 46px;

      padding: 0;

      border-radius: 50%;

      background:
        rgba(0,0,0,.75);

      border:
        1px solid
        rgba(255,255,255,.2);

      color: white;

      font-size: 18px;

      z-index: 90;

      display: none;

    }


    /* =====================================
       CONTROLES
    ===================================== */

    #controls {

      position: fixed;

      left: 50%;
      bottom: 20px;

      transform:
        translateX(-50%);

      width: min(94%, 500px);

      padding: 10px;

      background:
        rgba(10,10,10,.86);

      border-radius: 16px;

      z-index: 70;

      display: none;

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

    }


    .row {

      display: flex;

      gap: 8px;

    }


    .row + .row {

      margin-top: 8px;

    }


    .row button {

      flex: 1;

      background: #252525;

      color: white;

    }


    #size {

      display: flex;

      align-items: center;

      justify-content: center;

      min-width: 65px;

      color: white;

      font-size: 13px;

    }


    #hideControls {

      background: white;

      color: black;

    }


    @media (max-width: 500px) {

      #youtubeScreen {

        width: 90vw;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       MENU
  ====================================== -->

  <div id="menu">

    <h1>
      🥽 AR YouTube Cinema
    </h1>

    <p>
      Cole um vídeo do YouTube e depois
      inicie a experiência de realidade aumentada.
    </p>


    <input
      id="youtubeUrl"
      type="text"
      placeholder="https://www.youtube.com/watch?v=..."
      autocomplete="off"
    >


    <button id="loadVideo">
      Carregar vídeo
    </button>


    <button id="startAR">
      INICIAR AR
    </button>

  </div>


  <!-- =====================================
       RETÍCULO
  ====================================== -->

  <div id="reticle"></div>


  <!-- =====================================
       INSTRUÇÕES
  ====================================== -->

  <div id="instruction">

    Aponte a câmera para uma superfície
    e mova lentamente o celular.

  </div>


  <!-- =====================================
       STATUS
  ====================================== -->

  <div id="status">
    AR ativo
  </div>


  <!-- =====================================
       SAIR
  ====================================== -->

  <button id="exitAR">
    ✕
  </button>


  <!-- =====================================
       PLAYER YOUTUBE
  ====================================== -->

  <div id="youtubeScreen">

    <iframe
      id="youtubeFrame"

      allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        fullscreen
      "

      allowfullscreen>

    </iframe>

  </div>


  <!-- =====================================
       CONTROLES
  ====================================== -->

  <div id="controls">

    <div class="row">

      <button id="smaller">
        −
      </button>

      <div id="size">
        100%
      </div>

      <button id="larger">
        +
      </button>

    </div>


    <div class="row">

      <button id="reposition">
        Reposicionar
      </button>

      <button id="hideControls">
        Ocultar
      </button>

    </div>

  </div>


  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script type="module">


    /* =====================================
       IMPORTS ORIGINAIS
    ====================================== */

    import {
      WebXRButton
    } from './js/util/webxr-button.js';


    import {
      Scene
    } from './js/render/scenes/scene.js';


    import {
      Renderer,
      createWebGLContext
    } from './js/render/core/renderer.js';


    import {
      SkyboxNode
    } from './js/render/nodes/skybox.js';


    import {
      InlineViewerHelper
    } from './js/util/inline-viewer-helper.js';


    import {
      QueryArgs
    } from './js/util/query-args.js';


    import WebXRPolyfill
      from './js/third-party/webxr-polyfill/build/webxr-polyfill.module.js';


    /* =====================================
       POLYFILL
    ====================================== */

    if (
      QueryArgs.getBool(
        'usePolyfill',
        true
      )
    ) {

      new WebXRPolyfill();

    }


    /* =====================================
       ELEMENTOS
    ====================================== */

    const menu =
      document.getElementById(
        'menu'
      );


    const youtubeUrl =
      document.getElementById(
        'youtubeUrl'
      );


    const loadVideo =
      document.getElementById(
        'loadVideo'
      );


    const startAR =
      document.getElementById(
        'startAR'
      );


    const youtubeScreen =
      document.getElementById(
        'youtubeScreen'
      );


    const youtubeFrame =
      document.getElementById(
        'youtubeFrame'
      );


    const reticle =
      document.getElementById(
        'reticle'
      );


    const instruction =
      document.getElementById(
        'instruction'
      );


    const status =
      document.getElementById(
        'status'
      );


    const exitAR =
      document.getElementById(
        'exitAR'
      );


    const controls =
      document.getElementById(
        'controls'
      );


    const smaller =
      document.getElementById(
        'smaller'
      );


    const larger =
      document.getElementById(
        'larger'
      );


    const size =
      document.getElementById(
        'size'
      );


    const reposition =
      document.getElementById(
        'reposition'
      );


    const hideControls =
      document.getElementById(
        'hideControls'
      );


    /* =====================================
       XR GLOBALS
    ====================================== */

    let xrButton = null;

    let xrSession = null;

    let xrImmersiveRefSpace = null;

    let viewerSpace = null;

    let hitTestSource = null;

    let hitTestSourceRequested = false;


    /* =====================================
       WEBGL GLOBALS
    ====================================== */

    let gl = null;

    let renderer = null;

    let scene = new Scene();


    /* =====================================
       SKYBOX
    ====================================== */

    let skybox =
      new SkyboxNode({
        url:
          'media/textures/milky-way-4k.png'
      });


    scene.addNode(
      skybox
    );


    /* =====================================
       PLAYER
    ====================================== */

    let youtubeVideoId = null;

    let screenScale = 1;

    let screenPlaced = false;


    /* =====================================
       EXTRAI ID YOUTUBE
    ====================================== */

    function getYouTubeId(
      url
    ) {

      if (!url) {

        return null;

      }


      url =
        url.trim();


      try {

        const parsed =
          new URL(url);


        /*
          youtube.com/watch?v=
        */

        if (
          parsed.hostname.includes(
            'youtube.com'
          )
        ) {

          const video =
            parsed.searchParams.get(
              'v'
            );

          if (video) {

            return video;

          }

        }


        /*
          youtu.be/
        */

        if (
          parsed.hostname ===
          'youtu.be'
        ) {

          return parsed.pathname
            .replace('/', '')
            .split('?')[0];

        }


        /*
          shorts
        */

        if (
          parsed.pathname
            .startsWith('/shorts/')
        ) {

          return parsed.pathname
            .split('/shorts/')[1]
            .split('/')[0];

        }


        /*
          embed
        */

        if (
          parsed.pathname
            .startsWith('/embed/')
        ) {

          return parsed.pathname
            .split('/embed/')[1]
            .split('/')[0];

        }

      } catch (error) {

        console.error(
          error
        );

      }


      return null;

    }


    /* =====================================
       CARREGAR VÍDEO
    ====================================== */

    loadVideo.addEventListener(
      'click',
      () => {

        const id =
          getYouTubeId(
            youtubeUrl.value
          );


        if (!id) {

          alert(
            'Cole uma URL válida do YouTube.'
          );

          return;

        }


        youtubeVideoId =
          id;


        youtubeFrame.src =
          'https://www.youtube.com/embed/' +
          encodeURIComponent(id) +
          '?autoplay=1' +
          '&playsinline=1' +
          '&rel=0';


        youtubeScreen.style.display =
          'block';


        status.textContent =
          'Vídeo carregado';


        status.style.display =
          'block';

      }
    );


    /* =====================================
       WEBGL
       IMPORTANTE:
       MANTIDO COMO NO CÓDIGO ORIGINAL
    ====================================== */

    function initGL() {

      if (gl) {

        return;

      }


      gl =
        createWebGLContext({

          xrCompatible:
            true

        });


      /*
        Exatamente como no código
        original que funcionou.
      */

      document.body.appendChild(
        gl.canvas
      );


      function onResize() {

        gl.canvas.width =
          gl.canvas.clientWidth *
          window.devicePixelRatio;


        gl.canvas.height =
          gl.canvas.clientHeight *
          window.devicePixelRatio;

      }


      window.addEventListener(
        'resize',
        onResize
      );


      onResize();


      renderer =
        new Renderer(gl);


      scene.setRenderer(
        renderer
      );

    }


    /* =====================================
       INICIALIZAR WEBXR
    ====================================== */

    function initXR() {

      xrButton =
        new WebXRButton({

          onRequestSession:
            onRequestSession,

          onEndSession:
            onEndSession,

          textEnterXRTitle:
            'START AR',

          textXRNotFoundTitle:
            'AR NÃO ENCONTRADO',

          textExitXRTitle:
            'SAIR DO AR'

        });


      /*
        Mantemos o botão oficial
        escondido visualmente.
      */

      xrButton.domElement.style.display =
        'none';


      document.body.appendChild(
        xrButton.domElement
      );


      if (
        navigator.xr
      ) {

        navigator.xr
          .isSessionSupported(
            'immersive-ar'
          )
          .then(
            supported => {

              xrButton.enabled =
                supported;


              startAR.disabled =
                !supported;


              if (!supported) {

                startAR.textContent =
                  'AR NÃO DISPONÍVEL';

              }

            }
          );

      } else {

        startAR.disabled =
          true;

        startAR.textContent =
          'WEBXR NÃO DISPONÍVEL';

      }

    }


    /* =====================================
       PEDIR AR
    ====================================== */

    function onRequestSession() {

      const sessionInit = {

        requiredFeatures: [

          'local'

        ],

        optionalFeatures: [

          'hit-test'

        ]

      };


      /*
        Tenta adicionar DOM Overlay.

        Nem todo navegador aceita,
        por isso fazemos de maneira
        segura.
      */

      if (
        'domOverlay' in
        navigator.xr
      ) {

        sessionInit.optionalFeatures
          .push(
            'dom-overlay'
          );

      }


      /*
        Se o navegador suportar
        DOM Overlay, usamos a página
        como camada de interface.
      */

      sessionInit.domOverlay = {

        root: document.body

      };


      return navigator.xr
        .requestSession(
          'immersive-ar',
          sessionInit
        )
        .then(
          session => {

            xrSession =
              session;


            xrButton.setSession(
              session
            );


            session.isImmersive =
              true;


            onSessionStarted(
              session
            );

          }
        );

    }


    /* =====================================
       SESSION START
    ====================================== */

    function onSessionStarted(
      session
    ) {

      session.addEventListener(
        'end',
        onSessionEnded
      );


      /*
        Esconde céu.
      */

      skybox.visible =
        false;


      /*
        Inicializa WebGL.
      */

      initGL();


      /*
        Configura camada XR.
      */

      session.updateRenderState({

        baseLayer:
          new XRWebGLLayer(
            session,
            gl
          )

      });


      /*
        Reference space.
      */

      session
        .requestReferenceSpace(
          'local'
        )
        .then(
          refSpace => {

            xrImmersiveRefSpace =
              refSpace;


            /*
              Viewer space
              para hit-test.
            */

            return session
              .requestReferenceSpace(
                'viewer'
              );

          }
        )
        .then(
          viewer => {

            viewerSpace =
              viewer;


            session.requestAnimationFrame(
              onXRFrame
            );

          }
        );


      /*
        Interface.
      */

      menu.style.display =
        'none';


      status.style.display =
        'block';


      status.textContent =
        'AR ativo';


      instruction.style.display =
        'block';


      reticle.style.display =
        'block';


      exitAR.style.display =
        'block';


      if (
        youtubeVideoId
      ) {

        youtubeScreen.style.display =
          'block';


        controls.style.display =
          'block';

      }

    }


    /* =====================================
       HIT TEST SOURCE
    ====================================== */

    function requestHitTestSource(
      session
    ) {

      if (
        hitTestSourceRequested
      ) {

        return;

      }


      hitTestSourceRequested =
        true;


      if (
        !session.requestHitTestSource
      ) {

        console.warn(
          'Hit Test não suportado.'
        );

        return;

      }


      session
        .requestHitTestSource({

          space:
            viewerSpace

        })
        .then(
          source => {

            hitTestSource =
              source;

          }
        );


      session.addEventListener(
        'end',
        () => {

          hitTestSource =
            null;

          hitTestSourceRequested =
            false;

        },
        {
          once: true
        }
      );

    }


    /* =====================================
       FRAME
    ====================================== */

    function onXRFrame(
      time,
      frame
    ) {

      const session =
        frame.session;


      session.requestAnimationFrame(
        onXRFrame
      );


      /*
        Hit test.
      */

      requestHitTestSource(
        session
      );


      /*
        Pose.
      */

      const pose =
        frame.getViewerPose(
          xrImmersiveRefSpace
        );


      if (!pose) {

        return;

      }


      /*
        Resultado hit test.
      */

      if (
        hitTestSource
      ) {

        const results =
          frame.getHitTestResults(
            hitTestSource
          );


        if (
          results.length > 0
        ) {

          const hit =
            results[0];


          const hitPose =
            hit.getPose(
              xrImmersiveRefSpace
            );


          if (hitPose) {

            reticle.style.opacity =
              '1';

            status.textContent =
              'Superfície detectada';

          }

        } else {

          reticle.style.opacity =
            '.35';

          status.textContent =
            'Procurando superfície...';

        }

      }


      /*
        Renderiza WebGL.
      */

      scene.startFrame();


      scene.drawXRFrame(
        frame,
        pose
      );


      scene.endFrame();

    }


    /* =====================================
       TOQUE PARA POSICIONAR
    ====================================== */

    document.addEventListener(
      'touchend',
      event => {

        if (!xrSession) {

          return;

        }


        /*
          Não interfere nos controles.
        */

        if (
          event.target.closest(
            '#controls'
          ) ||
          event.target.closest(
            '#youtubeScreen'
          )
        ) {

          return;

        }


        if (
          hitTestSource
        ) {

          screenPlaced =
            true;


          instruction.style.display =
            'none';


          status.textContent =
            'Tela posicionada';

        }

      }
    );


    /* =====================================
       ESCALA
    ====================================== */

    function updateScale() {

      screenScale =
        Math.max(
          .5,
          Math.min(
            2.5,
            screenScale
          )
        );


      youtubeScreen.style.transform =
        'translate(-50%, -50%) scale(' +
        screenScale +
        ')';


      size.textContent =
        Math.round(
          screenScale * 100
        ) + '%';

    }


    /* =====================================
       MENOR
    ====================================== */

    smaller.addEventListener(
      'click',
      () => {

        screenScale -= .1;

        updateScale();

      }
    );


    /* =====================================
       MAIOR
    ====================================== */

    larger.addEventListener(
      'click',
      () => {

        screenScale += .1;

        updateScale();

      }
    );


    /* =====================================
       REPOSICIONAR
    ====================================== */

    reposition.addEventListener(
      'click',
      () => {

        screenPlaced =
          false;


        instruction.style.display =
          'block';


        status.textContent =
          'Aponte para outra superfície';

      }
    );


    /* =====================================
       OCULTAR CONTROLES
    ====================================== */

    hideControls.addEventListener(
      'click',
      () => {

        controls.style.display =
          'none';

      }
    );


    /* =====================================
       SAIR
    ====================================== */

    exitAR.addEventListener(
      'click',
      () => {

        if (
          xrSession
        ) {

          xrSession.end();

        }

      }
    );


    /* =====================================
       SESSION END
    ====================================== */

    function onEndSession(
      session
    ) {

      if (
        session
      ) {

        session.end();

      }

    }


    function onSessionEnded(
      event
    ) {

      xrSession =
        null;


      hitTestSource =
        null;


      hitTestSourceRequested =
        false;


      screenPlaced =
        false;


      skybox.visible =
        true;


      menu.style.display =
        'block';


      instruction.style.display =
        'none';


      reticle.style.display =
        'none';


      status.style.display =
        'none';


      exitAR.style.display =
        'none';


      controls.style.display =
        'none';


      /*
        O vídeo continua carregado,
        então pode ser reaberto.
      */

      if (
        xrButton
      ) {

        xrButton.setSession(
          null
        );

      }

    }


    /* =====================================
       BOTÃO START AR
    ====================================== */

    startAR.addEventListener(
      'click',
      () => {

        if (
          !navigator.xr
        ) {

          alert(
            'Seu navegador não possui WebXR.'
          );

          return;

        }


        onRequestSession();

      }
    );


    /* =====================================
       INICIALIZA
    ====================================== */

    initXR();

  </script>

</body>

</html>
