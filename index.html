<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AR Glasses</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
}

/* Câmera */
#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* Tela virtual */
#virtualScreen {
    position: absolute;
    width: 320px;
    height: 220px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: rgba(10, 10, 15, 0.88);
    border: 2px solid #00ffff;
    border-radius: 12px;

    box-shadow:
        0 0 20px rgba(0,255,255,.6),
        inset 0 0 20px rgba(0,255,255,.1);

    z-index: 5;

    overflow: hidden;

    resize: both;
}

/* Barra da tela */
#screenHeader {
    height: 35px;
    background: rgba(0,0,0,.8);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 10px;

    cursor: move;

    border-bottom: 1px solid #00ffff;
}

#screenHeader span {
    font-size: 13px;
    color: #00ffff;
}

#close {
    background: none;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

/* Conteúdo */
#content {
    width: 100%;
    height: calc(100% - 35px);
    border: 0;
}

/* Menu */
#menu {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    z-index: 10;

    display: flex;
    gap: 8px;

    background: rgba(0,0,0,.75);

    padding: 10px;

    border-radius: 15px;

    backdrop-filter: blur(10px);
}

button {
    border: 1px solid #00ffff;

    background: #111;

    color: white;

    padding: 10px 14px;

    border-radius: 8px;

    cursor: pointer;
}

button:hover {
    background: #00ffff;
    color: #000;
}

#urlInput {
    width: 180px;

    background: #111;
    color: white;

    border: 1px solid #555;

    border-radius: 8px;

    padding: 10px;
}

/* Modo central */
#crosshair {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 8px;
    height: 8px;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(0,255,255,.7);

    border-radius: 50%;

    z-index: 3;

    pointer-events: none;
}
</style>
</head>

<body>

<!-- Câmera -->
<video id="camera" autoplay playsinline></video>

<!-- Mira -->
<div id="crosshair"></div>

<!-- Tela virtual -->
<div id="virtualScreen">

    <div id="screenHeader">
        <span>AR SCREEN</span>

        <button id="close">×</button>
    </div>

    <iframe
        id="content"
        src="https://example.com">
    </iframe>

</div>

<!-- Controles -->
<div id="menu">

    <button onclick="startCamera()">
        📷 AR
    </button>

    <input
        id="urlInput"
        placeholder="https://site.com">

    <button onclick="openURL()">
        Abrir
    </button>

    <button onclick="captureScreen()">
        📱 Tela
    </button>

</div>


<script>

const camera = document.getElementById("camera");

const virtualScreen =
    document.getElementById("virtualScreen");

const content =
    document.getElementById("content");

const close =
    document.getElementById("close");


// =============================
// CÂMERA
// =============================

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });

        camera.srcObject = stream;

    } catch (error) {

        alert(
            "Não foi possível acessar a câmera."
        );

        console.error(error);
    }
}


// =============================
// ABRIR SITE
// =============================

function openURL() {

    let url =
        document.getElementById("urlInput").value;

    if (!url)
        return;

    if (!url.startsWith("http"))
        url = "https://" + url;

    content.src = url;
}


// =============================
// FECHAR TELA
// =============================

close.onclick = function() {

    virtualScreen.style.display = "none";

};


// =============================
// CAPTURAR TELA
// =============================

async function captureScreen() {

    try {

        const stream =
            await navigator.mediaDevices.getDisplayMedia({

                video: true,

                audio: false

            });

        content.srcObject = stream;

        /*
        Alguns navegadores não permitem
        colocar MediaStream diretamente
        em iframe.

        Por isso esta função é experimental.
        */

    } catch (error) {

        console.log(
            "Captura cancelada."
        );

    }

}


// =============================
// ARRASTAR TELA
// =============================

const header =
    document.getElementById("screenHeader");

let dragging = false;

let offsetX = 0;
let offsetY = 0;


header.addEventListener(
    "pointerdown",
    startDrag
);

function startDrag(e) {

    dragging = true;

    const rect =
        virtualScreen.getBoundingClientRect();

    offsetX =
        e.clientX - rect.left;

    offsetY =
        e.clientY - rect.top;

    header.setPointerCapture(
        e.pointerId
    );
}


header.addEventListener(
    "pointermove",
    e => {

        if (!dragging)
            return;

        virtualScreen.style.left =
            (e.clientX - offsetX) + "px";

        virtualScreen.style.top =
            (e.clientY - offsetY) + "px";

        virtualScreen.style.transform =
            "none";

    }
);


header.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);


// =============================
// INICIAR
// =============================

startCamera();

</script>

</body>
</html>
