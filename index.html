<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>AR Glasses</title>

<style>

/* ================================
   BASE
================================ */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

}


/* ================================
   CÂMERA
================================ */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    background: #000;

}


/* ================================
   TELA AR
================================ */

#arScreen {

    position: fixed;

    width: 320px;
    height: 220px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 10;

    background:
        rgba(10,10,15,.92);

    border:
        2px solid #00ffff;

    border-radius: 12px;

    box-shadow:
        0 0 25px
        rgba(0,255,255,.6);

    overflow: hidden;

}


/* ================================
   CABEÇALHO
================================ */

#header {

    height: 40px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 10px;

    background:
        rgba(0,0,0,.9);

    border-bottom:
        1px solid #00ffff;

    color: #00ffff;

    font-size: 12px;

    font-weight: bold;

    touch-action: none;

}


#close {

    width: 30px;
    height: 30px;

    padding: 0;

    border: none;

    background: transparent;

    color: white;

    font-size: 22px;

}


/* ================================
   CONTEÚDO
================================ */

#screenContent {

    height:
        calc(100% - 40px);

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 12px;

    color: white;

    text-align: center;

}


/* ================================
   MENU
================================ */

#controls {

    position: fixed;

    left: 50%;

    bottom: 20px;

    transform:
        translateX(-50%);

    z-index: 20;

    display: flex;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,0,0,.8);

    border:
        1px solid
        rgba(255,255,255,.2);

    border-radius: 14px;

}


/* ================================
   BOTÕES
================================ */

button {

    appearance: none;

    -webkit-appearance: none;

    border: 1px solid #00ffff;

    background: #111;

    color: white;

    border-radius: 8px;

    padding: 10px 14px;

    font-size: 12px;

    cursor: pointer;

}


button:active {

    transform: scale(.95);

}


/* ================================
   STATUS
================================ */

#status {

    position: fixed;

    top: 15px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 30;

    padding: 8px 12px;

    background:
        rgba(0,0,0,.75);

    color: white;

    border-radius: 8px;

    font-size: 12px;

}

</style>

</head>


<body>


<!-- ================================
     CÂMERA
================================ -->

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<!-- ================================
     STATUS
================================ -->

<div id="status">

    Iniciando câmera...

</div>


<!-- ================================
     TELA VIRTUAL
================================ -->

<div id="arScreen">


    <div id="header">

        <span>
            AR SCREEN
        </span>


        <button
            type="button"
            id="close">

            ×

        </button>

    </div>


    <div id="screenContent">

        <strong>
            TELA VIRTUAL
        </strong>

        <span>
            Esta é sua primeira tela AR.
        </span>

        <span>
            Arraste pelo cabeçalho.
        </span>

    </div>


</div>


<!-- ================================
     CONTROLES
================================ -->

<div id="controls">


    <button
        type="button"
        id="cameraButton">

        📷 Câmera

    </button>


    <button
        type="button"
        id="newScreen">

        ＋ Tela

    </button>


</div>


<script>

/* =================================
   ELEMENTOS
================================= */

const camera =
    document.getElementById(
        "camera"
    );


const status =
    document.getElementById(
        "status"
    );


const arScreen =
    document.getElementById(
        "arScreen"
    );


const close =
    document.getElementById(
        "close"
    );


const cameraButton =
    document.getElementById(
        "cameraButton"
    );


const newScreen =
    document.getElementById(
        "newScreen"
    );


/* =================================
   CÂMERA
================================= */

async function startCamera() {

    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        }

                    },

                    audio: false

                });


        camera.srcObject =
            stream;


        status.textContent =
            "Câmera ativada";


        setTimeout(() => {

            status.style.display =
                "none";

        }, 2000);


    } catch (error) {

        console.error(error);

        status.textContent =
            "Não foi possível acessar a câmera.";

    }

}


/* =================================
   FECHAR TELA
================================= */

close.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();

        arScreen.style.display =
            "none";

    }
);


/* =================================
   NOVA TELA
================================= */

newScreen.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();


        arScreen.style.display =
            "block";


        /*
         * Reposiciona no centro
         */

        arScreen.style.left =
            "50%";

        arScreen.style.top =
            "50%";

        arScreen.style.transform =
            "translate(-50%, -50%)";

    }
);


/* =================================
   BOTÃO CÂMERA
================================= */

cameraButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();

        startCamera();

    }
);


/* =================================
   ARRASTAR TELA
================================= */

const header =
    document.getElementById(
        "header"
    );


let dragging = false;

let offsetX = 0;

let offsetY = 0;


header.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;


        const rect =
            arScreen
                .getBoundingClientRect();


        offsetX =
            event.clientX -
            rect.left;


        offsetY =
            event.clientY -
            rect.top;


        header.setPointerCapture(
            event.pointerId
        );

    }
);


header.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging)
            return;


        arScreen.style.left =
            (
                event.clientX -
                offsetX
            ) + "px";


        arScreen.style.top =
            (
                event.clientY -
                offsetY
            ) + "px";


        arScreen.style.transform =
            "none";

    }
);


header.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


header.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

    }
);


/* =================================
   INICIAR
================================= */

startCamera();

</script>

</body>

</html>
