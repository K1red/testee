<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>AR Glasses</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================
   CÂMERA
===================================== */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;
}


/* =====================================
   MIRA
===================================== */

#crosshair {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(0,255,255,.8);

    border-radius: 50%;

    z-index: 2;

    pointer-events: none;
}


/* =====================================
   TELA VIRTUAL
===================================== */

#virtualScreen {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 320px;
    height: 220px;

    transform: translate(-50%, -50%);

    background: rgba(10,10,15,.94);

    border: 2px solid #00ffff;

    border-radius: 12px;

    overflow: hidden;

    z-index: 5;

    box-shadow:
        0 0 20px rgba(0,255,255,.5),
        0 0 50px rgba(0,255,255,.15);

    resize: both;

    min-width: 220px;
    min-height: 150px;
}


/* =====================================
   CABEÇALHO
===================================== */

#screenHeader {

    height: 36px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 8px;

    background: rgba(0,0,0,.9);

    border-bottom: 1px solid #00ffff;

    cursor: grab;

    touch-action: none;
}

#screenHeader:active {
    cursor: grabbing;
}


#screenTitle {

    color: #00ffff;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;
}


#close {

    width: 30px;
    height: 30px;

    padding: 0;

    border: 0;

    background: transparent;

    color: white;

    font-size: 22px;

    cursor: pointer;
}


/* =====================================
   CONTEÚDO
===================================== */

#content {

    width: 100%;
    height: calc(100% - 36px);

    border: 0;

    background: white;
}


/* Vídeo da tela capturada */

#screenCapture {

    width: 100%;
    height: calc(100% - 36px);

    object-fit: contain;

    background: #000;

    display: none;
}


/* =====================================
   MENU
===================================== */

#menu {

    position: fixed;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    z-index: 20;

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 9px;

    max-width: calc(100% - 20px);

    background: rgba(0,0,0,.78);

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 14px;

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);
}


/* =====================================
   INPUT
===================================== */

#urlInput {

    width: 150px;

    height: 38px;

    padding: 0 10px;

    border: 1px solid #444;

    border-radius: 8px;

    outline: none;

    background: #111;

    color: white;

    font-size: 12px;
}


/* =====================================
   BOTÕES
===================================== */

button {

    height: 38px;

    padding: 0 12px;

    border: 1px solid #00ffff;

    border-radius: 8px;

    background: #111;

    color: white;

    font-size: 12px;

    cursor: pointer;

    white-space: nowrap;

    touch-action: manipulation;
}


button:active {

    transform: scale(.96);

}


button:hover {

    background: #00ffff;

    color: #000;
}


/* =====================================
   STATUS
===================================== */

#status {

    position: fixed;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    padding: 8px 12px;

    border-radius: 8px;

    background: rgba(0,0,0,.7);

    font-size: 11px;

    opacity: 0;

    transition: opacity .3s;

    pointer-events: none;
}


#status.show {

    opacity: 1;
}


/* =====================================
   CELULAR
===================================== */

@media (max-width: 600px) {

    #menu {

        flex-wrap: wrap;

        justify-content: center;

    }

    #urlInput {

        width: 140px;

    }

    #virtualScreen {

        width: 290px;
        height: 200px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     CÂMERA
===================================== -->

<video
    id="camera"
    autoplay
    playsinline
    muted
></video>


<!-- =====================================
     MIRA
===================================== -->

<div id="crosshair"></div>


<!-- =====================================
     STATUS
===================================== -->

<div id="status"></div>


<!-- =====================================
     TELA VIRTUAL
===================================== -->

<div id="virtualScreen">


    <div id="screenHeader">

        <span id="screenTitle">
            AR SCREEN
        </span>

        <button
            type="button"
            id="close"
        >
            ×
        </button>

    </div>


    <!-- Conteúdo de sites -->

    <iframe
        id="content"
        src="about:blank"
        allow="fullscreen"
    ></iframe>


    <!-- Conteúdo da captura -->

    <video
        id="screenCapture"
        autoplay
        playsinline
        muted
    ></video>


</div>


<!-- =====================================
     MENU
===================================== -->

<div id="menu">


    <button
        type="button"
        id="cameraButton"
    >
        📷 AR
    </button>


    <input
        id="urlInput"
        type="url"
        placeholder="https://site.com"
        autocomplete="off"
    >


    <button
        type="button"
        id="openButton"
    >
        Abrir
    </button>


    <button
        type="button"
        id="captureButton"
    >
        📱 Tela
    </button>


</div>


<script>


/* =====================================
   ELEMENTOS
===================================== */

const camera =
    document.getElementById("camera");

const virtualScreen =
    document.getElementById("virtualScreen");

const content =
    document.getElementById("content");

const screenCapture =
    document.getElementById("screenCapture");

const closeButton =
    document.getElementById("close");

const cameraButton =
    document.getElementById("cameraButton");

const openButton =
    document.getElementById("openButton");

const captureButton =
    document.getElementById("captureButton");

const urlInput =
    document.getElementById("urlInput");

const status =
    document.getElementById("status");


/* =====================================
   STATUS
===================================== */

let statusTimer;


function showStatus(message) {

    status.textContent = message;

    status.classList.add("show");

    clearTimeout(statusTimer);

    statusTimer = setTimeout(() => {

        status.classList.remove("show");

    }, 2500);
}


/* =====================================
   CÂMERA
===================================== */

async function startCamera() {

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            showStatus(
                "Seu navegador não suporta câmera."
            );

            return;
        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    }

                },

                audio: false

            });


        camera.srcObject = stream;

        showStatus("Câmera AR ativada.");

    }

    catch (error) {

        console.error(error);

        showStatus(
            "Permissão da câmera recusada."
        );

    }

}


/* =====================================
   ABRIR SITE
===================================== */

function openURL() {

    let url =
        urlInput.value.trim();


    if (!url) {

        showStatus(
            "Digite uma URL."
        );

        return;
    }


    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        url =
            "https://" + url;

    }


    /*
       Mostra o iframe
       e esconde a captura
    */

    content.style.display =
        "block";

    screenCapture.style.display =
        "none";


    content.src = url;


    virtualScreen.style.display =
        "block";


    showStatus(
        "Página carregada na tela AR."
    );

}


/* =====================================
   CAPTURA DE TELA
===================================== */

async function captureScreen() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia) {

        showStatus(
            "Seu navegador não permite captura de tela."
        );

        return;
    }


    try {

        /*
           IMPORTANTE:

           O navegador vai abrir a própria
           janela de seleção de tela.

           Isso não deve ser colocado
           dentro de um iframe.
        */

        const stream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: true,

                    audio: false

                });


        /*
           Coloca a captura no vídeo
        */

        screenCapture.srcObject =
            stream;


        content.style.display =
            "none";

        screenCapture.style.display =
            "block";


        virtualScreen.style.display =
            "block";


        showStatus(
            "Tela compartilhada."
        );


        /*
           Se o usuário parar o compartilhamento
        */

        const tracks =
            stream.getVideoTracks();


        if (tracks.length > 0) {

            tracks[0].addEventListener(
                "ended",
                () => {

                    screenCapture.srcObject =
                        null;

                    screenCapture.style.display =
                        "none";

                    content.style.display =
                        "block";

                    showStatus(
                        "Compartilhamento encerrado."
                    );

                }
            );

        }

    }

    catch (error) {

        console.log(error);

        showStatus(
            "Captura cancelada."
        );

    }

}


/* =====================================
   FECHAR TELA
===================================== */

closeButton.addEventListener(
    "click",
    () => {

        virtualScreen.style.display =
            "none";

    }
);


/* =====================================
   BOTÃO CÂMERA
===================================== */

cameraButton.addEventListener(
    "click",
    () => {

        startCamera();

    }
);


/* =====================================
   BOTÃO ABRIR
===================================== */

openButton.addEventListener(
    "click",
    () => {

        openURL();

    }
);


/* =====================================
   ENTER NA URL
===================================== */

urlInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            openURL();

        }

    }
);


/* =====================================
   CAPTURA
===================================== */

captureButton.addEventListener(
    "click",
    () => {

        captureScreen();

    }
);


/* =====================================
   ARRASTAR TELA
===================================== */

let dragging = false;

let offsetX = 0;
let offsetY = 0;


const header =
    document.getElementById("screenHeader");


header.addEventListener(
    "pointerdown",
    event => {

        dragging = true;


        const rect =
            virtualScreen
                .getBoundingClientRect();


        offsetX =
            event.clientX - rect.left;


        offsetY =
            event.clientY - rect.top;


        header.setPointerCapture(
            event.pointerId
        );

    }
);


header.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;


        virtualScreen.style.left =
            (event.clientX - offsetX) + "px";


        virtualScreen.style.top =
            (event.clientY - offsetY) + "px";


        virtualScreen.style.transform =
            "none";

    }
);


header.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);


header.addEventListener(
    "pointercancel",
    () => {

        dragging = false;

    }
);


/* =====================================
   INICIAR
===================================== */

startCamera();

</script>


</body>

</html>
